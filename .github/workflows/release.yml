name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ============================================================
  #  Native builds: Linux + macOS
  # ============================================================
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: macos-15-intel
            target: darwin-x86_64
          - os: macos-14
            target: darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBIRUN_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build -j

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="birun-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp build/birun "dist/$NAME/birun"
          cp README.md LICENSE "dist/$NAME/" 2>/dev/null || true
          tar -czf "dist/${NAME}.tar.gz" -C dist "$NAME"
          cd dist
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: birun-${{ matrix.target }}
          path: dist/*

  # ============================================================
  #  Windows: cross-compile static .exe from Linux
  # ============================================================
  build-windows:
    name: windows-x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y mingw-w64

      - name: Configure (Windows target)
        run: >
          cmake -S . -B build-win
          -DCMAKE_SYSTEM_NAME=Windows
          -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++
          -DCMAKE_BUILD_TYPE=Release
          -DBIRUN_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build-win -j

      - name: Verify static .exe (no runtime DLLs)
        run: |
          file build-win/birun.exe
          x86_64-w64-mingw32-objdump -p build-win/birun.exe | grep "DLL Name"
          if x86_64-w64-mingw32-objdump -p build-win/birun.exe | grep -E "libgcc|libstdc\+\+"; then
            echo "ERROR: dynamic runtime dependency in .exe"
            exit 1
          fi
          x86_64-w64-mingw32-strip build-win/birun.exe

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="birun-${VERSION}-windows-x86_64"
          mkdir -p "dist/$NAME"
          cp build-win/birun.exe "dist/$NAME/birun.exe"
          cp README.md LICENSE "dist/$NAME/" 2>/dev/null || true
          # tar.gz for consistency; Windows 10+ has built-in tar.
          tar -czf "dist/${NAME}.tar.gz" -C dist "$NAME"
          cd dist
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: birun-windows-x86_64
          path: dist/*

  # ============================================================
  #  Single release with all assets
  # ============================================================
  release:
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -lh dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true