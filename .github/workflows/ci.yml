name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMAKE_GENERATOR: Ninja
  CTEST_OUTPUT_ON_FAILURE: 1
  CATCH2_VERSION: v3.5.4

jobs:

  # ============================================================
  #  Build + test on Linux (gcc, clang) and macOS (clang)
  # ============================================================
  build-and-test:
    name: build / ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: clang
          - os: macos-latest
            compiler: clang

    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake git
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            sudo apt-get install -y clang
          fi

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja cmake

      - name: Build and install Catch2 v3
        run: |
          git clone --depth 1 --branch "${CATCH2_VERSION}" \
            https://github.com/catchorg/Catch2.git /tmp/catch2
          cmake -S /tmp/catch2 -B /tmp/catch2/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCATCH_BUILD_TESTING=OFF \
            -DCATCH_INSTALL_DOCS=OFF \
            -DCATCH_INSTALL_EXTRAS=OFF
          cmake --build /tmp/catch2/build --parallel
          sudo cmake --install /tmp/catch2/build

      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBIRUN_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ============================================================
  #  Smoke test — end-to-end user workflow (no tests, faster)
  # ============================================================
  smoke:
    name: smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Build (no tests)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBIRUN_BUILD_TESTS=OFF
          cmake --build build --parallel

      - name: Version check
        run: ./build/birun --version

      - name: Init + list + run
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          "$GITHUB_WORKSPACE/build/birun" --init
          test -f birun.bi
          "$GITHUB_WORKSPACE/build/birun" --list
          "$GITHUB_WORKSPACE/build/birun" hello

      - name: JSON output well-formed
        run: |
          cd /tmp/smoke
          "$GITHUB_WORKSPACE/build/birun" --json > out.json
          python3 -c "import json; json.load(open('out.json'))"
          echo "PASS: valid JSON"