name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Smoke
        run: |
          ./build/birun --version
          mkdir -p /tmp/s && cd /tmp/s
          "$GITHUB_WORKSPACE/build/birun" --init
          "$GITHUB_WORKSPACE/build/birun" --list
          "$GITHUB_WORKSPACE/build/birun" hello