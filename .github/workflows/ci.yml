name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: build / ${{ matrix.os }} / ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
        exclude:
          - os: macos-latest
            compiler: gcc
    steps:
      - uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake git
          git clone --depth 1 --branch v3.5.4 https://github.com/catchorg/Catch2.git /tmp/catch2
          cmake -S /tmp/catch2 -B /tmp/catch2/build -DCMAKE_BUILD_TYPE=Release -DCATCH_BUILD_TESTING=OFF
          sudo cmake --install /tmp/catch2/build

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja cmake catch2

      - name: Configure
        env:
          CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
          CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBIRUN_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  smoke:
    name: smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Build (no tests)
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBIRUN_BUILD_TESTS=OFF
          cmake --build build --parallel

      - name: Smoke test
        run: |
          ./build/birun --version
          mkdir -p /tmp/smoke && cd /tmp/smoke
          "$GITHUB_WORKSPACE/build/birun" --init
          "$GITHUB_WORKSPACE/build/birun" --list